<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="image-container">
        Hover over an image below to display here.
    </div>

    <div id="thumbnails">
        <img class="preview" alt="Happy black poodle with a red bandana" src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        
        <img class="preview" alt="Two dogs sleeping and hugging" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        
        <img class="preview" alt="Obedient brown puppy" src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=400" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        
        <img class="preview" alt="Golden Retriever running on the grass" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=400" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        
        <img class="preview" alt="Cute puppy looking straight ahead" src="https://images.unsplash.com/photo-1591160690555-5debfba289f0?w=400" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
        
        <img class="preview" alt="Adorable smiling Corgi" src="https://images.unsplash.com/photo-1615751072497-5f5169febe17?w=400" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    </div>

</body>
</html>
